name: af_players
description: "Video player with French TTS voice-over from subtitles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & routing
  get: ^4.7.2

  # Video: native ExoPlayer via MethodChannel (no Flutter plugin)
  # TTS: native Android TextToSpeech via MethodChannel (no Flutter plugin)

  # File management
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  shared_preferences: ^2.3.4
  wakelock_plus: ^1.2.8
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
